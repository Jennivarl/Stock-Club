<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stock Club · Buy</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg: #ffffff; --fg: #111; --muted: #666; --card: #f3f4f6; --accent: #f0b90b; --ok: #16a34a; --bad: #dc2626; --line: #d1d5db; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17181c; --fg: #eee; --muted: #9aa0a6; --card: #23252b; --line: #3a3d44; } }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font: 16px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         background: var(--tg-theme-bg-color, var(--bg)); color: var(--tg-theme-text-color, var(--fg)); }
  h1 { font-size: 22px; margin: 4px 0; }
  .muted { color: var(--tg-theme-hint-color, var(--muted)); font-size: 14px; }
  .card { background: var(--tg-theme-secondary-bg-color, var(--card)); border-radius: 14px; padding: 14px; margin: 12px 0; }
  .steps { list-style: none; margin: 0; padding: 0; }
  .steps li { display: flex; align-items: center; gap: 10px; padding: 7px 0; color: var(--tg-theme-hint-color, var(--muted)); }
  .steps .dot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center;
                font-size: 13px; font-weight: 700; flex: none; }
  .steps li.active { color: inherit; font-weight: 600; }
  .steps li.active .dot { border-color: var(--accent); background: var(--accent); color: #111; }
  .steps li.done { color: inherit; }
  .steps li.done .dot { border-color: var(--ok); background: var(--ok); color: #fff; }
  .steps li.fail .dot { border-color: var(--bad); background: var(--bad); color: #fff; }
  button { width: 100%; padding: 14px; margin: 8px 0 0; border: 0; border-radius: 12px; font-size: 16px; font-weight: 600;
           background: var(--accent); color: #111; cursor: pointer; }
  button.secondary { background: transparent; color: inherit; border: 1px solid var(--line); }
  #msg { margin: 0 0 6px; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent;
          border-radius: 50%; animation: r .8s linear infinite; vertical-align: -1px; margin-right: 6px; }
  @keyframes r { to { transform: rotate(360deg); } }
  .big { font-size: 44px; margin: 4px 0; }
  .center { text-align: center; }
  a { color: inherit; }
  code { font-size: 13px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <h1 id="title">Loading…</h1>
  <div id="summary" class="muted">Getting your order…</div>

  <div class="card" id="stepsCard">
    <ul class="steps">
      <li id="s-connect"><span class="dot">1</span>Connect your wallet</li>
      <li id="s-allow" class="hidden"><span class="dot">2</span>Allow USDT for this buy</li>
      <li id="s-buy"><span class="dot">2</span>Confirm the buy</li>
      <li id="s-done"><span class="dot">3</span>Done</li>
    </ul>
  </div>

  <div class="card" id="action">
    <p id="msg">Getting your order…</p>
    <div id="detail" class="muted"></div>
    <button id="btnMain" class="hidden"></button>
    <button id="btnSecond" class="secondary hidden"></button>
  </div>

  <div class="card center hidden" id="doneCard">
    <div class="big" id="doneIcon">✅</div>
    <h1 id="doneTitle"></h1>
    <p id="doneText" class="muted"></p>
    <p><a id="doneLink" target="_blank">View on BscScan</a></p>
    <button id="btnClose">Back to Telegram</button>
  </div>

  <p class="muted center">You keep your keys. Stock Club never holds your money.</p>

<script type="module">
// The wallet connection lives on our server (src/walletconnect.ts): on iPhone, Telegram pauses this page
// while you're in Binance, so the page can't hold it. This page only shows buttons and opens Binance.
const tg = window.Telegram?.WebApp; tg?.ready(); tg?.expand();
const t = new URLSearchParams(location.search).get("t");
const $ = (id) => document.getElementById(id);
const show = (id, on = true) => $(id).classList.toggle("hidden", !on);
const openLink = (u) => (tg?.openLink ? tg.openLink(u) : window.open(u, "_blank"));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const BINANCE = "https://app.binance.com/cedefi"; // opens Binance Wallet so it shows the waiting request

let plan, order, sell = false, link;

// Send what happens on the phone to our server log, so we see real errors instead of guessing.
function log(event, detail = "") {
  fetch(`/api/log?t=${encodeURIComponent(t)}`, { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ event, detail: String(detail).slice(0, 500), tg: tg?.platform }) }).catch(() => {});
}
window.addEventListener("error", (e) => log("js-error", e.message));
window.addEventListener("unhandledrejection", (e) => log("promise-error", e.reason?.message ?? e.reason));
document.addEventListener("visibilitychange", () => log("visible", String(!document.hidden)));

async function api(path, body, params = {}) {
  const q = new URLSearchParams({ t, ...params });
  const r = await fetch(`/api/${path}?${q}`, body
    ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || `Error ${r.status}`);
  return j;
}

// ---- screen ----
const NUM = {};
function step(id, state) { // state: "" | "active" | "done" | "fail"
  const li = $(`s-${id}`), dot = li.querySelector(".dot");
  NUM[id] ??= dot.textContent;
  li.classList.remove("active", "done", "fail"); if (state) li.classList.add(state);
  dot.textContent = state === "done" ? "✓" : state === "fail" ? "!" : NUM[id];
}
function screen(msg, detail = "", button, second) {
  $("msg").innerHTML = msg; $("detail").innerHTML = detail;
  for (const [id, b] of [["btnMain", button], ["btnSecond", second]]) {
    show(id, !!b);
    if (b) { $(id).textContent = b.label; $(id).onclick = b.onClick; }
  }
}
const waiting = (text) => `<span class="spin"></span>${text}`;
const failed = (msg) => screen(`<span class="bad">${msg}</span>`, "Nothing happened to your money.", { label: "Try again", onClick: makePlan });
const openWallet = { label: "Open Binance Wallet", onClick: () => { log("open-wallet-tap"); openLink(BINANCE); } };
const short = (a) => `${a.slice(0, 6)}…${a.slice(-4)}`;

function doneScreen(o) {
  show("stepsCard", false); show("action", false); show("doneCard");
  const ok = o.status === "filled", wait = o.status === "submitted";
  $("doneIcon").textContent = ok ? "✅" : wait ? "⏳" : "❌";
  $("doneTitle").textContent = ok ? (sell ? `You sold your ${order.ticker} for ${Number(o.qty ?? 0).toFixed(2)} USDT` : `You bought ${Number(o.qty ?? 0).toFixed(6)} ${order.ticker}`)
    : wait ? "Sent, waiting for the chain" : `The ${sell ? "sale" : "buy"} didn't go through`;
  $("doneText").textContent = ok ? `${sell ? "In" : `For $${order.amount}, in`} your own wallet. We posted it in your club chat.`
    : wait ? "We'll post the result in your club chat." : (o.error ?? "Nothing happened.");
  show("doneLink", !!o.txHash); if (o.txHash) $("doneLink").href = `https://bscscan.com/tx/${o.txHash}`;
  if (ok) tg?.HapticFeedback?.notificationOccurred("success");
}
$("btnClose").onclick = () => (tg?.close ? tg.close() : window.close());

// ---- flow ----
async function load() {
  try {
    order = await api("order");
    sell = order.side === "sell";
    if (sell) {
      $("title").textContent = `Sell your ${order.ticker}`;
      $("summary").textContent = `Your club voted yes. This sells all your ${order.ticker} for USDT, in your own wallet.`;
      $("s-allow").lastChild.textContent = `Allow ${order.ticker} for this sale`;
      $("s-buy").lastChild.textContent = "Confirm the sale";
    } else {
      $("title").textContent = `Buy $${order.amount} of ${order.ticker}`;
      $("summary").textContent = `Your club voted yes. This buys it with USDT (${order.platform === "bstock" ? "bStocks" : "Ondo"}), in your own wallet.`;
    }
    if (order.status === "expired") {
      step("connect", "fail");
      return screen(`This ${sell ? "Sell" : "Buy"} link has expired.`, `${sell ? "Sell" : "Buy"} links last 2 hours after the vote. Start a new vote in the group.`);
    }
    if (order.status !== "pending") return doneScreen(order);
    await checkWallet();
  } catch (e) {
    $("title").textContent = "Can't open this page"; $("summary").textContent = e.message; show("stepsCard", false); show("action", false);
  }
}

// Connected already (from an earlier trade)? Go straight to the price. Otherwise show Connect.
async function checkWallet() {
  step("connect", "active");
  screen(waiting("Checking your wallet…"));
  const w = await api("wallet");
  if (w.connected) return makePlan();
  link = w.link;
  keepLinkFresh();
  screen(`Connect the wallet that holds your ${sell ? order.ticker : "USDT"} and a little BNB (BNB Smart Chain).`,
    "Binance Wallet opens. Approve the connection there, then come back to Telegram.",
    { label: "Connect Binance Wallet", onClick: connect });
}

// Connect links expire after 5 minutes. The server makes a new one after 4, so ask for it every
// 30 s and whenever you come back to this page, so the button never opens an expired link.
let fresher;
function keepLinkFresh() {
  const refresh = async () => { const w = await api("wallet").catch(() => null); if (w?.link) link = w.link; };
  clearInterval(fresher);
  fresher = setInterval(refresh, 30_000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
}

async function connect() {
  log("connect-tap");
  openLink(link); // right on the tap: Telegram on iPhone only opens other apps from a tap
  screen("Approve the connection in <b>Binance Wallet</b>, then come back to Telegram.",
    waiting("Waiting for Binance. This page updates by itself."),
    { label: "Open Binance Wallet again", onClick: () => openLink(link) });
  const t0 = Date.now();
  while (Date.now() - t0 < 5 * 60_000) {
    await sleep(2000);
    const w = await api("wallet").catch(() => null);
    if (w?.connected) { log("connected", w.address); return makePlan(); }
    if (w?.link && w.link !== link) link = w.link; // the old link expired; the server made a new one
  }
  screen("<span class=\"bad\">We didn't hear back from Binance.</span>", "If you're on a network that blocks crypto sites, try a VPN.",
    { label: "Try again", onClick: checkWallet });
}

async function makePlan() {
  clearInterval(fresher); // connected, no more connect links needed
  step("connect", "done"); step("allow", ""); step("buy", "active");
  screen(waiting("Getting a price from Binance…"));
  try {
    plan = await api("plan", {});
    if (plan.approve) {
      show("s-allow"); NUM.buy = "3"; NUM.done = "4"; step("allow", "active"); step("buy", ""); step("done", "");
    }
    const wl = `Wallet <code>${short(plan.wallet)}</code>: ${plan.balances.usdt.toFixed(2)} USDT, ${plan.balances.bnb.toFixed(5)} BNB.`;
    const info = sell
      ? `You sell <b>${plan.fromQty.toFixed(6)} ${order.ticker}</b> and get about <b>${plan.expectedQty.toFixed(2)} USDT</b> (at least ${plan.minQty.toFixed(2)}).<br>${wl}`
      : `You get about <b>${plan.expectedQty.toFixed(6)} ${order.ticker}</b> (at least ${plan.minQty.toFixed(6)}).<br>${wl}`;
    const other = { label: "Use a different wallet", onClick: resetWallet };
    if (plan.approve) {
      screen(sell ? `First, allow the sale to use <b>exactly ${plan.fromQty.toFixed(6)} ${order.ticker}</b> (not more).`
        : `First, allow the buy to use <b>exactly $${order.amount} USDT</b> (not more).`,
        info, { label: `Allow ${sell ? order.ticker : "USDT"}`, onClick: allow }, other);
    } else {
      screen(sell ? `Ready to sell <b>all your ${order.ticker}</b>.` : `Ready to buy <b>$${order.amount} of ${order.ticker}</b>.`,
        info, { label: sell ? "Sell" : "Buy", onClick: trade }, other);
    }
  } catch (e) {
    screen(`<span class="bad">${e.message}</span>`, "", { label: "Try again", onClick: makePlan }, { label: "Use a different wallet", onClick: resetWallet });
  }
}

async function resetWallet() {
  log("reset-wallet");
  screen(waiting("Disconnecting…"));
  await api("wallet/reset", {}).catch(() => {});
  step("allow", ""); show("s-allow", false);
  checkWallet();
}

// Sends the request through our server and opens Binance on the same tap.
// Then waits for the server: the wallet's answer, or the chain showing it happened.
async function ask(kind, done) {
  log("send-tap", kind);
  const sent = api("send", { kind });
  openLink(BINANCE);
  const word = kind === "approve" ? "approval" : sell ? "sale" : "buy";
  screen(`Confirm in <b>Binance Wallet</b>, then come back to Telegram.`,
    waiting(`Watching for your ${word}. This page updates by itself.`), openWallet);
  try { await sent; } catch (e) { throw e; }
  const t0 = Date.now();
  while (Date.now() - t0 < 20 * 60_000) {
    await sleep(2500);
    const p = await api("progress").catch(() => null);
    if (!p) continue;
    const r = done(p);
    if (r) return r;
    if (p.request?.status === "error") {
      const m = p.request.error ?? "";
      if (/reject|denied|cancel|4001|5000/i.test(m)) throw new Error("You said no in your wallet.");
      // e.g. expired: it may still have gone through, so give the chain a little longer
      if (Date.now() - p.request.at > 60_000) throw new Error("Your wallet didn't confirm.");
    }
  }
  throw new Error("We didn't see it on the chain after 20 minutes.");
}

async function allow() {
  try {
    await ask("approve", (p) => p.approved);
    log("allow-ok");
    step("allow", "done"); step("buy", "active");
  } catch (e) { return failed(e.message); }
  // Now that the approval is on-chain, get a fresh price and a trade we checked against the chain.
  screen(waiting("✅ Allowed. Getting a fresh price…"));
  try {
    plan = await api("plan", {});
    screen(sell ? `✅ ${order.ticker} allowed. Now confirm the sale.` : "✅ USDT allowed. Now confirm the buy.",
      sell ? `You get about <b>${plan.expectedQty.toFixed(2)} USDT</b> (at least ${plan.minQty.toFixed(2)}).`
        : `You get about <b>${plan.expectedQty.toFixed(6)} ${order.ticker}</b> (at least ${plan.minQty.toFixed(6)}).`,
      { label: sell ? "Sell" : "Buy", onClick: trade });
  } catch (e) {
    screen(`<span class="bad">${e.message}</span>`, "", { label: "Try again", onClick: makePlan });
  }
}

async function trade() {
  try {
    await ask("trade", (p) => p.status !== "pending");
    step("buy", "done");
    screen(waiting("Sent! Waiting for the chain to confirm…"));
    for (let i = 0; i < 60; i++) {
      const p = await api("progress").catch(() => null);
      if (p && p.status !== "pending" && p.status !== "submitted") return doneScreen(p);
      await sleep(2000);
    }
    doneScreen(await api("progress"));
  } catch (e) { failed(e.message); }
}

load();
</script>
</body>
</html>
