<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stock Club · Buy</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg: #ffffff; --fg: #111; --muted: #666; --card: #f3f4f6; --accent: #f0b90b; --ok: #16a34a; --bad: #dc2626; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17181c; --fg: #eee; --muted: #9aa0a6; --card: #23252b; } }
  body { margin: 0; padding: 16px; font: 16px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         background: var(--tg-theme-bg-color, var(--bg)); color: var(--tg-theme-text-color, var(--fg)); }
  h1 { font-size: 22px; margin: 4px 0 12px; }
  .card { background: var(--tg-theme-secondary-bg-color, var(--card)); border-radius: 14px; padding: 14px; margin: 12px 0; }
  .muted { color: var(--tg-theme-hint-color, var(--muted)); font-size: 14px; }
  button { width: 100%; padding: 14px; margin: 6px 0; border: 0; border-radius: 12px; font-size: 16px; font-weight: 600;
           background: var(--accent); color: #111; cursor: pointer; }
  button.secondary { background: transparent; color: inherit; border: 1px solid var(--tg-theme-hint-color, #999); }
  button:disabled { opacity: .5; }
  .step { display: flex; gap: 8px; align-items: baseline; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  code { word-break: break-all; font-size: 13px; }
  .hidden { display: none; }
</style>
</head>
<body>
  <h1 id="title">Loading…</h1>
  <div class="card">
    <div id="summary" class="muted">Getting your order…</div>
  </div>

  <div id="connectBox" class="card hidden">
    <b>1. Connect your wallet</b>
    <p class="muted">Use the wallet that holds your USDT and a little BNB on BNB Smart Chain.</p>
    <button id="btnConnect">Connect wallet</button>
    <p class="muted">Pick <b>Binance Wallet</b>, approve in the app, then come back to Telegram.</p>
  </div>

  <div id="buyBox" class="card hidden">
    <b>2. Buy</b>
    <div id="plan" class="muted"></div>
    <button id="btnBuy" disabled>Buy</button>
    <button id="btnConfirm" class="hidden">Open Binance Wallet to confirm</button>
    <p class="muted">Your wallet will ask you to confirm. You keep your keys; Stock Club never holds your money.</p>
  </div>

  <div id="status" class="card hidden"></div>

<script>
// Debug: record what happens to WalletConnect's relay connection on the phone (open / error / close codes).
(() => {
  const t = new URLSearchParams(location.search).get("t");
  const send = (event, detail) => fetch(`/api/log?t=${encodeURIComponent(t)}`, { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ event, detail: String(detail).slice(0, 400) }) }).catch(() => {});
  const Native = window.WebSocket;
  let n = 0;
  window.WebSocket = function (url, protocols) {
    const id = ++n, host = String(url).split("?")[0], t0 = Date.now();
    send("ws-new", `#${id} ${host}`);
    // Full relay URL (has a short-lived relay auth token, no wallet data) so the server can replay it and see the real error.
    if (id <= 2) fetch(`/api/log?t=${encodeURIComponent(t)}`, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ event: "ws-url", detail: String(url) }) }).catch(() => {});
    const ws = protocols ? new Native(url, protocols) : new Native(url);
    let sent = 0, recv = 0;
    const origSend = ws.send.bind(ws);
    ws.send = (d) => { sent++; return origSend(d); };
    ws.addEventListener("open", () => send("ws-open", `#${id} after ${Date.now() - t0}ms`));
    ws.addEventListener("message", () => { recv++; });
    ws.addEventListener("error", () => send("ws-error", `#${id} after ${Date.now() - t0}ms state=${ws.readyState}`));
    ws.addEventListener("close", (e) => send("ws-close", `#${id} code=${e.code} reason=${e.reason || "-"} clean=${e.wasClean} sent=${sent} recv=${recv} after ${Date.now() - t0}ms`));
    return ws;
  };
  window.WebSocket.prototype = Native.prototype;
  Object.assign(window.WebSocket, { CONNECTING: 0, OPEN: 1, CLOSING: 2, CLOSED: 3 });
  send("page-load", navigator.userAgent);
})();
</script>
<script src="/wallet.js"></script>
<script type="module">
const tg = window.Telegram?.WebApp; tg?.ready(); tg?.expand();
const t = new URLSearchParams(location.search).get("t");
const $ = (id) => document.getElementById(id);
const show = (id, on = true) => $(id).classList.toggle("hidden", !on);
const say = (html, cls = "") => { show("status"); $("status").innerHTML = `<span class="${cls}">${html}</span>`; };
const openLink = (u) => (tg?.openLink ? tg.openLink(u) : window.open(u, "_blank"));
const BINANCE_WC = "https://app.binance.com/cedefi"; // from WalletConnect's wallet directory

let wallet, plan, order;

// Send what happens on the phone to our server log, so we see real errors instead of guessing.
function log(event, detail = "") {
  fetch(`/api/log?t=${encodeURIComponent(t)}`, { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ event, detail: String(detail).slice(0, 500), ua: navigator.userAgent, tg: tg?.platform }) }).catch(() => {});
}
window.addEventListener("error", (e) => log("js-error", e.message));
window.addEventListener("unhandledrejection", (e) => log("promise-error", e.reason?.message ?? e.reason));

async function api(path, body) {
  const r = await fetch(`/api/${path}?t=${encodeURIComponent(t)}`, body
    ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || `Error ${r.status}`);
  return j;
}

async function load() {
  try {
    order = await api("order");
    $("title").textContent = `Buy $${order.amount} of ${order.ticker}`;
    $("summary").innerHTML = `Your club voted yes. This buys <b>$${order.amount}</b> of <b>${order.ticker}</b>
      (${order.platform === "bstock" ? "bStocks" : "Ondo"}) with USDT, in your own wallet.`;
    if (order.status === "pending") show("connectBox");
    else say(`This buy is already <b>${order.status}</b>.` + (order.txHash ? ` <a href="https://bscscan.com/tx/${order.txHash}">BscScan</a>` : ""));
  } catch (e) { $("title").textContent = "Can't open this buy"; $("summary").textContent = e.message; }
}

// Wallet connection: Reown AppKit (WalletConnect's official modal), bundled in /wallet.js.
let wc;
async function startWallet() {
  const { walletConnectProjectId } = await api("config");
  wc = window.SCWallet.initWallet(walletConnectProjectId, (address) => {
    log("account", address ?? "none");
    if (address && address !== wallet) {
      wallet = address;
      show("connectBox", false);
      say(`Connected: <code>${wallet}</code>`, "ok");
      makePlan();
    }
  });
}

$("btnConnect").onclick = () => { log("open-modal"); wc?.open(); };

async function makePlan() {
  show("buyBox"); $("plan").textContent = "Getting a price from Binance…"; $("btnBuy").disabled = true;
  try {
    plan = await api("plan", { wallet });
    $("plan").innerHTML = `You get about <b>${plan.expectedQty.toFixed(6)} ${order.ticker}</b> (at least ${plan.minQty.toFixed(6)}).<br>
      Wallet: ${plan.balances.usdt.toFixed(2)} USDT, ${plan.balances.bnb.toFixed(5)} BNB.<br>
      ${plan.approve ? "Your wallet will ask <b>twice</b>: first to allow this USDT amount, then to buy." : "Your wallet will ask once to confirm."}`;
    $("btnBuy").disabled = false;
  } catch (e) { $("plan").innerHTML = `<span class="bad">${e.message}</span>`; }
}

// Our server checks the chain (we don't rely on the wallet connection for reads).
async function waitReceipt(hash) {
  for (let i = 0; i < 60; i++) {
    const r = await fetch(`/api/receipt?t=${encodeURIComponent(t)}&h=${hash}`).then((x) => x.json()).catch(() => null);
    if (r?.status) return r;
    await new Promise((res) => setTimeout(res, 3000));
  }
  throw new Error("Approval not confirmed after 3 minutes");
}

// Link to bring the wallet app forward for a pending request. Prefer what the wallet told us in its
// session metadata; fall back to Binance's universal link from WalletConnect's directory.
function walletLink() { return BINANCE_WC; }

// Sends one request to the wallet and shows a button to open the wallet (apps only open from a tap in Telegram).
async function walletRequest(label, tx) {
  log("request-start", label);
  show("btnConfirm"); $("btnConfirm").textContent = `Open Binance Wallet to confirm (${label})`;
  try {
    const h = await wc.send({ from: wallet, ...tx });
    log("request-ok", `${label} ${h}`);
    return h;
  } catch (e) {
    log("request-error", `${label} code=${e?.code} msg=${e?.message} data=${JSON.stringify(e?.data ?? null)}`);
    throw e;
  } finally { show("btnConfirm", false); }
}

async function buy() {
  $("btnBuy").disabled = true;
  try {
    if (plan.approve) {
      say("Step 1 of 2: tap <b>Open Binance Wallet to confirm</b> and allow USDT.");
      const h = await walletRequest("allow USDT", plan.approve);
      say("Waiting for the approval to confirm…");
      const r = await waitReceipt(h);
      if (r.status !== "0x1") throw new Error("The approval failed.");
    }
    say(`${plan.approve ? "Step 2 of 2: " : ""}tap <b>Open Binance Wallet to confirm</b> and approve the buy.`);
    const hash = await walletRequest("buy", plan.tx);
    await api("sent", { wallet, txHash: hash });
    say(`✅ Sent! I'll post the result in your club chat when it confirms.<br><a href="https://bscscan.com/tx/${hash}">View on BscScan</a>`, "ok");
    show("buyBox", false);
    tg?.HapticFeedback?.notificationOccurred("success");
  } catch (e) {
    say(`❌ ${e.message}. Nothing was bought. You can try again.`, "bad");
    await makePlan(); // prices move; get a fresh one
  }
}

$("btnConfirm").onclick = () => { const u = walletLink(); log("open-confirm-tap", u); openLink(u); };
$("btnBuy").onclick = buy;
load();
startWallet().catch((e) => { log("init-error", e?.message); say("Couldn't load the wallet connector: " + e?.message, "bad"); });
</script>
</body>
</html>
